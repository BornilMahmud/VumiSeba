services:
  - type: web
    name: vumiseba-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:server
    startCommand: node dist-server/server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: landtech-e5773
      - key: SIMULATE_SMS
        value: "true"
      - key: SIMULATE_EMAIL
        value: "true"
