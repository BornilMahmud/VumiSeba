name: VumiSeba CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client and server
        run: |
          npx tsc --noEmit
          npx tsc -p server/tsconfig.json --noEmit

      - name: Run Core Correctness, Risk Engine & Acceptance Tests
        run: npm test

      - name: Run Firebase Auth Rules & Security Tests
        run: npm run test:firebase

      - name: Build client & server production bundles
        run: npm run build
